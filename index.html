<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text Pad</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="body">
    <div class = "main">
        <div class = "instruction">Click on the microphone to begin talking</div>
        <div class = "microphone"></div>
        <textarea class = "speechOutput" readonly></textarea>
    </div>
    <div class="ins"> 
        <h1>Instruction</h1>
        
      <p>If you don’t see any output, then either your mic isn’t working, your voice is quieter, or your internet is slow.</p>
<p>If all of that seems fine, just keep refreshing — eventually, things magically start working.</p>
    </div>
    </div>
</body>
</html>
